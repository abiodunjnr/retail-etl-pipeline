
name: Retail ETL - Continuous Integration

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

jobs:
  backend-tests:
    name: ETL and API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Generate pipeline outputs
        run: |
          python -m scripts.run_pipeline

      - name: Verify monitoring records
        run: |
          python -c "import sqlite3; from api.monitoring_db import DB_PATH; db=sqlite3.connect(DB_PATH); runs=db.execute('SELECT COUNT(*) FROM pipeline_runs WHERE status = ?', ('SUCCESS',)).fetchone()[0]; metrics=db.execute('SELECT COUNT(*) FROM pipeline_quality_metrics').fetchone()[0]; assert runs >= 1, 'No successful pipeline run'; assert metrics == 3, f'Expected 3 quality records, got {metrics}'; print('Monitoring validation passed'); db.close()"

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v

  frontend-tests:
    name: React Frontend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production frontend
        run: npm run build
